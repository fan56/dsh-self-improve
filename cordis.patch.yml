# dsh-self-improve bundle patch: mounts the plugin under the stable id
# `dsh-self-improve`. Landed: the three-key settings namespace (improveLoop /
# improveJevBackend / improveJevModel), the session-signal collector, the
# observation feed, the action ledger, the /improve-review approval command
# and the skills-draft generator (wave N3). Later waves register here: the
# N2 trigger engine and the N4 jev decision gates.

- insert:
    - id: dsh-self-improve
      name: '@aiwayds/dsh-self-improve'
